<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FC사나이 팀선택</title>
    <style>
        :root {
            --bg-deep: #090d16;
            --bg-card: #131b2e;
            --bg-item: #1c273e;
            --bg-input: #23314e;
            --border: rgba(255, 255, 255, 0.08);
            --primary: #38bdf8;
            --accent: #f59e0b;
            --danger: #ef4444;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Segoe UI", Roboto, sans-serif;
            letter-spacing: -0.02em;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            padding: 14px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 580px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        h1 {
            font-size: 1.35rem;
            font-weight: 800;
            text-align: center;
            color: var(--primary);
            padding: 6px 0;
        }

        /* 탭 버튼 */
        .tabs {
            display: flex;
            gap: 6px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-sub);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #040914;
            border-color: var(--primary);
        }

        /* 카드 공통 */
        .card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 14px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }

        .card-header {
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--primary);
        }

        /* 참석자 리스트 */
        .attendance-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
            gap: 6px;
        }

        .attendance-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            background: var(--bg-item);
            border-radius: 6px;
            cursor: pointer;
            user-select: none;
            font-size: 0.82rem;
            border: 1px solid transparent;
            transition: all 0.15s;
        }

        .attendance-item.checked {
            background: rgba(56, 189, 248, 0.15);
            border-color: var(--primary);
            color: #ffffff;
        }

        .style-tag {
            font-size: 0.7rem;
            padding: 2px 5px;
            border-radius: 4px;
            font-weight: 600;
        }

        .style-공격적 { color: #f87171; background: rgba(239, 68, 68, 0.15); }
        .style-밸런스 { color: #38bdf8; background: rgba(56, 189, 248, 0.15); }
        .style-수비적 { color: #4ade80; background: rgba(34, 197, 94, 0.15); }

        /* 로스터 리스트 (폰트 벌어짐 방지) */
        .roster-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .roster-item {
            background: var(--bg-item);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            border: 1px solid var(--border);
        }

        .roster-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .roster-name-box {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.88rem;
            font-weight: 700;
        }

        .ovr-pill {
            background: var(--accent);
            color: #050811;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.72rem;
            font-weight: 800;
        }

        .stat-columns {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            text-align: center;
            font-size: 0.72rem;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
            padding: 3px 0;
            color: var(--text-sub);
        }

        .stat-box b {
            display: block;
            color: var(--primary);
            font-size: 0.78rem;
            margin-top: 1px;
        }

        /* 폼 요소 */
        .input-group {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }

        input, select {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        .stat-input-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin-bottom: 10px;
        }

        .stat-input-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            font-size: 0.72rem;
            color: var(--text-sub);
        }

        .stat-input-item input {
            width: 100%;
            text-align: center;
            padding: 6px 0;
        }

        /* 버튼 */
        .action-btn {
            background: var(--primary);
            color: #040914;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            font-size: 0.9rem;
            transition: opacity 0.15s;
        }

        .action-btn:active {
            opacity: 0.85;
        }

        .sub-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-sub);
            padding: 4px 8px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.75rem;
            line-height: 1.2;
        }

        /* 매치 결과 렌더 */
        .match-teams {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 8px;
        }

        .team-block {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            padding: 10px;
            border-left: 3px solid var(--primary);
            border-top: 1px solid var(--border);
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        .team-title {
            display: flex;
            justify-content: space-between;
            font-size: 0.88rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .team-members {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .member-badge {
            background: var(--bg-item);
            border: 1px solid var(--border);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.78rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <h1>FC사나이 팀선택</h1>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('match')">매치 편성</button>
        <button class="tab-btn" onclick="switchTab('roster')">선수 명단 (21인)</button>
    </div>

    <!-- 탭 1: 매치 편성 -->
    <div id="tab-match">
        <div class="card">
            <div class="card-header">
                <span>1. 참석 선수 선택 (<span id="attendee-count">0</span>명)</span>
                <div>
                    <button class="sub-btn" onclick="toggleAllAttendance(true)">전체선택</button>
                    <button class="sub-btn" onclick="toggleAllAttendance(false)">해제</button>
                </div>
            </div>
            <div class="attendance-grid" id="attendance-list"></div>
        </div>

        <div class="card" style="margin-top: 12px;">
            <div class="card-header">
                <span>2. 매치 설정</span>
            </div>
            <div style="display:flex; gap:8px; align-items:center; margin-bottom: 10px;">
                <label style="font-size: 0.82rem; color: var(--text-sub);">팀 분할:</label>
                <select id="team-count" style="flex:1;">
                    <option value="2">2개 팀 (12인 매치)</option>
                    <option value="3">3개 팀 (18인 매치)</option>
                </select>
            </div>
            <button class="action-btn" onclick="generateTeams()">밸런스 매칭 실행</button>
        </div>

        <div class="card" id="result-card" style="display:none; margin-top: 12px;">
            <div class="card-header">
                <span>편성 결과</span>
                <button class="sub-btn" onclick="copyResult()">카톡 결과 복사</button>
            </div>
            <div id="match-teams" class="match-teams"></div>
            <button class="action-btn" style="margin-top:12px; background:var(--accent);" onclick="confirmMatch()">이 팀 조합 확정 (히스토리 누적)</button>
        </div>
    </div>

    <!-- 탭 2: 로스터 관리 -->
    <div id="tab-roster" style="display:none;">
        <div class="card">
            <div class="card-header">선수 등록 (풋살 성향 & FM 능력치 1~10)</div>
            <div class="input-group">
                <input type="text" id="new-name" placeholder="선수 이름" style="flex:1;">
                <select id="new-style">
                    <option value="공격적">공격적</option>
                    <option value="밸런스" selected>밸런스</option>
                    <option value="수비적">수비적</option>
                </select>
            </div>

            <div class="stat-input-row">
                <div class="stat-input-item"><span>슈팅</span><input type="number" id="stat-sht" min="1" max="10" value="6"></div>
                <div class="stat-input-item"><span>패스</span><input type="number" id="stat-pas" min="1" max="10" value="6"></div>
                <div class="stat-input-item"><span>드리블</span><input type="number" id="stat-dri" min="1" max="10" value="6"></div>
                <div class="stat-input-item"><span>수비</span><input type="number" id="stat-def" min="1" max="10" value="6"></div>
                <div class="stat-input-item"><span>체력</span><input type="number" id="stat-sta" min="1" max="10" value="6"></div>
            </div>

            <button class="action-btn" onclick="addPlayer()">선수 추가</button>

            <div style="display:flex; gap:6px; margin-top:10px;">
                <button class="sub-btn" style="flex:1;" onclick="loadDefault21()">21명 기본데이터 복구</button>
                <button class="sub-btn" style="color:var(--danger);" onclick="resetHistory()">매칭 히스토리 초기화</button>
            </div>
        </div>

        <div class="card" style="margin-top: 12px;">
            <div class="card-header">등록된 선수 명단 (<span id="total-player-count">0</span>/21)</div>
            <div class="roster-grid" id="roster-list"></div>
        </div>
    </div>
</div>

<script>
    const STORAGE_KEY_PLAYERS = 'fcsanai_futsal_players_v2';
    const STORAGE_KEY_HISTORY = 'fcsanai_team_history_v2';

    let players = JSON.parse(localStorage.getItem(STORAGE_KEY_PLAYERS)) || [];
    let historyMatrix = JSON.parse(localStorage.getItem(STORAGE_KEY_HISTORY)) || {};
    let currentGeneratedTeams = [];

    function calcOVR(stats) {
        const sum = (stats.sht || 5) + (stats.pas || 5) + (stats.dri || 5) + (stats.def || 5) + (stats.sta || 5);
        return (sum / 5).toFixed(1);
    }

    function savePlayers() {
        localStorage.setItem(STORAGE_KEY_PLAYERS, JSON.stringify(players));
        renderRoster();
        renderAttendance();
    }

    function saveHistory() {
        localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(historyMatrix));
    }

    function switchTab(tab) {
        document.getElementById('tab-match').style.display = tab === 'match' ? 'block' : 'none';
        document.getElementById('tab-roster').style.display = tab === 'roster' ? 'block' : 'none';
        document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
            btn.classList.toggle('active', (tab === 'match' && idx === 0) || (tab === 'roster' && idx === 1));
        });
    }

    function loadDefault21() {
        if (!confirm('21명 기본 풋살 데이터로 초기화하시겠습니까?')) return;
        const styles = ['공격적', '밸런스', '수비적'];
        players = [];
        for (let i = 1; i <= 21; i++) {
            const base = ((i % 5) + 4);
            players.push({
                id: 'p_' + i,
                name: '선수 ' + i,
                style: styles[(i - 1) % styles.length],
                stats: {
                    sht: Math.min(10, Math.max(1, base + ((i % 3) - 1))),
                    pas: Math.min(10, Math.max(1, base + ((i % 2)))),
                    dri: Math.min(10, Math.max(1, base - ((i % 2)))),
                    def: Math.min(10, Math.max(1, 10 - base)),
                    sta: Math.min(10, Math.max(1, base + 1))
                },
                checked: i <= 12
            });
        }
        savePlayers();
    }

    function addPlayer() {
        const nameInput = document.getElementById('new-name');
        const name = nameInput.value.trim();
        if (!name) return alert('이름을 입력해주세요.');

        const stats = {
            sht: parseInt(document.getElementById('stat-sht').value) || 5,
            pas: parseInt(document.getElementById('stat-pas').value) || 5,
            dri: parseInt(document.getElementById('stat-dri').value) || 5,
            def: parseInt(document.getElementById('stat-def').value) || 5,
            sta: parseInt(document.getElementById('stat-sta').value) || 5
        };

        players.push({
            id: 'p_' + Date.now(),
            name: name,
            style: document.getElementById('new-style').value,
            stats: stats,
            checked: true
        });

        nameInput.value = '';
        savePlayers();
    }

    function removePlayer(id) {
        players = players.filter(p => p.id !== id);
        savePlayers();
    }

    function renderRoster() {
        const list = document.getElementById('roster-list');
        document.getElementById('total-player-count').innerText = players.length;
        list.innerHTML = players.map(p => {
            const ovr = calcOVR(p.stats);
            return `
                <div class="roster-item">
                    <div class="roster-header">
                        <div class="roster-name-box">
                            <span>${p.name}</span>
                            <span class="style-tag style-${p.style}">${p.style}</span>
                        </div>
                        <div style="display:flex; align-items:center; gap:6px;">
                            <span class="ovr-pill">OVR ${ovr}</span>
                            <button class="sub-btn" style="color:var(--danger);" onclick="removePlayer('${p.id}')">삭제</button>
                        </div>
                    </div>
                    <div class="stat-columns">
                        <div class="stat-box">슈팅<b>${p.stats.sht}</b></div>
                        <div class="stat-box">패스<b>${p.stats.pas}</b></div>
                        <div class="stat-box">드리블<b>${p.stats.dri}</b></div>
                        <div class="stat-box">수비<b>${p.stats.def}</b></div>
                        <div class="stat-box">체력<b>${p.stats.sta}</b></div>
                    </div>
                </div>
            `;
        }).join('');
    }

    function renderAttendance() {
        const list = document.getElementById('attendance-list');
        let checkedCount = 0;
        list.innerHTML = players.map(p => {
            if (p.checked) checkedCount++;
            const ovr = calcOVR(p.stats);
            return `
                <div class="attendance-item ${p.checked ? 'checked' : ''}" onclick="toggleAttendance('${p.id}')">
                    <span>${p.name}</span>
                    <div style="display:flex; align-items:center; gap:4px;">
                        <span class="style-tag style-${p.style}" style="font-size:0.65rem; padding:1px 3px;">${p.style[0]}</span>
                        <b style="color:var(--primary); font-size:0.75rem;">${ovr}</b>
                    </div>
                </div>
            `;
        }).join('');
        document.getElementById('attendee-count').innerText = checkedCount;
    }

    function toggleAttendance(id) {
        const p = players.find(x => x.id === id);
        if (p) p.checked = !p.checked;
        savePlayers();
    }

    function toggleAllAttendance(status) {
        players.forEach(p => p.checked = status);
        savePlayers();
    }

    function getTogetherCount(id1, id2) {
        const key = [id1, id2].sort().join('_');
        return historyMatrix[key] || 0;
    }

    function addTogetherCount(id1, id2) {
        const key = [id1, id2].sort().join('_');
        historyMatrix[key] = (historyMatrix[key] || 0) + 1;
    }

    // 밸런스 매칭 (OVR 차이 최소화 + 스타일 균등 분배 + 2회 이상 중복 배제)
    function generateTeams() {
        const attendees = players.filter(p => p.checked);
        const k = parseInt(document.getElementById('team-count').value);
        if (attendees.length < k * 2) {
            return alert(`인원이 부족합니다. 최소 ${k * 2}명 이상 선택해주세요.`);
        }

        let bestTeams = null;
        let bestCost = Infinity;

        for (let iter = 0; iter < 3000; iter++) {
            const shuffled = [...attendees].sort(() => Math.random() - 0.5);
            const teams = Array.from({ length: k }, () => []);

            shuffled.forEach((p, idx) => {
                teams[idx % k].push(p);
            });

            let cost = 0;

            // 1. OVR 균형 페널티
            const teamOVRs = teams.map(t => {
                const total = t.reduce((sum, p) => sum + parseFloat(calcOVR(p.stats)), 0);
                return total / t.length;
            });
            cost += (Math.max(...teamOVRs) - Math.min(...teamOVRs)) * 50;

            // 2. 공격/수비 스타일 쏠림 방지 페널티
            const atkCounts = teams.map(t => t.filter(p => p.style === '공격적').length);
            const defCounts = teams.map(t => t.filter(p => p.style === '수비적').length);
            cost += (Math.max(...atkCounts) - Math.min(...atkCounts)) * 15;
            cost += (Math.max(...defCounts) - Math.min(...defCounts)) * 15;

            // 3. 2회 이상 같은 편 중복 초고강도 회피
            for (let t of teams) {
                for (let i = 0; i < t.length; i++) {
                    for (let j = i + 1; j < t.length; j++) {
                        const count = getTogetherCount(t[i].id, t[j].id);
                        if (count >= 2) {
                            cost += 10000 * count;
                        } else if (count === 1) {
                            cost += 20;
                        }
                    }
                }
            }

            if (cost < bestCost) {
                bestCost = cost;
                bestTeams = teams;
            }
        }

        currentGeneratedTeams = bestTeams;
        renderResult(bestTeams);
    }

    function renderResult(teams) {
        const container = document.getElementById('match-teams');
        container.innerHTML = teams.map((team, idx) => {
            const avgOVR = (team.reduce((sum, p) => sum + parseFloat(calcOVR(p.stats)), 0) / team.length).toFixed(1);
            return `
                <div class="team-block">
                    <div class="team-title">
                        <span>팀 ${String.fromCharCode(65 + idx)} (${team.length}명)</span>
                        <span style="color:var(--accent);">평균 OVR: ${avgOVR}</span>
                    </div>
                    <div class="team-members">
                        ${team.map(p => `
                            <span class="member-badge">
                                <b>${p.name}</b>
                                <span class="style-tag style-${p.style}" style="font-size:0.65rem; padding:1px 3px;">${p.style}</span>
                            </span>
                        `).join('')}
                    </div>
                </div>
            `;
        }).join('');
        document.getElementById('result-card').style.display = 'block';
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    function confirmMatch() {
        if (!currentGeneratedTeams.length) return;
        if (!confirm('현재 팀 구성을 확정하시겠습니까? (같은 팀 이력이 누적됩니다)')) return;

        currentGeneratedTeams.forEach(team => {
            for (let i = 0; i < team.length; i++) {
                for (let j = i + 1; j < team.length; j++) {
                    addTogetherCount(team[i].id, team[j].id);
                }
            }
        });

        saveHistory();
        alert('매치 기록이 반영되었습니다! 다음 매칭 시 2회 이상 같은 팀이 되지 않도록 자동 회피됩니다.');
    }

    function copyResult() {
        if (!currentGeneratedTeams.length) return;
        let text = `⚽ FC사나이 목요 풋살 팀 편성 결과 ⚽\n\n`;
        currentGeneratedTeams.forEach((team, idx) => {
            const avgOVR = (team.reduce((sum, p) => sum + parseFloat(calcOVR(p.stats)), 0) / team.length).toFixed(1);
            text += `[ 팀 ${String.fromCharCode(65 + idx)} ] (평균 OVR: ${avgOVR})\n`;
            text += team.map(p => `${p.name}(${p.style})`).join(', ') + '\n\n';
        });

        navigator.clipboard.writeText(text).then(() => {
            alert('카톡방 공유용 텍스트가 복사되었습니다!');
        });
    }

    function resetHistory() {
        if (confirm('모든 과거 매칭 히스토리를 초기화하시겠습니까?')) {
            historyMatrix = {};
            saveHistory();
            alert('히스토리가 초기화되었습니다.');
        }
    }

    if (players.length === 0) {
        loadDefault21();
    } else {
        renderRoster();
        renderAttendance();
    }
</script>
</body>
</html>
